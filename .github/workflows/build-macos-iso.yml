name: Build macOS install ISO

# 按博客「官方制作镜像」流程制作 macOS 安装镜像（.iso）并发布到 Release
# https://blog.csdn.net/qq_40627654/article/details/105378155
#
# 1. hdiutil create -o <tmp>/<名称> -size <大小> -volname <名称> -layout SPUD -fs HFS+J
# 2. hdiutil attach <tmp>/<名称>.dmg -noverify -mountpoint /Volumes/<名称>
# 3. sudo <安装器>.app/Contents/Resources/createinstallmedia --volume /Volumes/<名称> --nointeraction
# 4. hdiutil detach /dev/diskN
# 5. hdiutil convert <tmp>/<名称>.dmg -format UDTO -o <tmp>/<名称>
# 6. mv <tmp>/<名称>.cdr <tmp>/<名称>.iso
#
# 唯一区别：CI 里无法登录 App Store 下载安装器，改用 Apple 官方命令行渠道获取：
#   - softwareupdate --fetch-full-installer（优先）
#   - 10.13–10.15 时可从 swcdn.apple.com 直链拼装（见 scripts/download-installer.sh）
# 注意：macOS 15.6 起 Apple 修复 CVE-2025-43187 后 `installer -pkg` 不再能安装
# 旧安装器（报 "Opened package is not the same at install time"），MIST 因此不可用。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS 版本，例如 10.15.7 / 11.7.10 / 13.7.6'
        required: true
        default: '10.15.7'
      name:
        description: '镜像文件名（不含扩展名），例如 Catalina'
        required: true
        default: 'Catalina'
      dmg_size:
        description: 'hdiutil -size 参数，Catalina 用 9000m'
        required: true
        default: '9000m'
      runner:
        description: '运行器（10.15 及更早必须用 Intel 运行器）'
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26
        default: macos-15-intel

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.name }} ${{ inputs.version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      VERSION: ${{ inputs.version }}
      NAME: ${{ inputs.name }}
      DMG_SIZE: ${{ inputs.dmg_size }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 macOS 安装器
        run: |
          set -euo pipefail
          df -h /System/Volumes/Data
          echo '--- softwareupdate 可用安装器 ---'
          softwareupdate --list-full-installers || true
          echo '--- 开始获取安装器 ---'
          bash scripts/download-installer.sh "${VERSION}" "${RUNNER_TEMP}/installer"
          echo '--- 获取完成 ---'
          echo "INSTALLER_APP=${INSTALLER_APP}"
          df -h /System/Volumes/Data

      - name: 制作安装镜像（官方 createinstallmedia 流程）
        run: |
          set -euo pipefail
          APP="${INSTALLER_APP:-}"
          if [ -z "${APP}" ] || [ ! -d "${APP}" ]; then
            APP="$(find /Applications -maxdepth 1 -name 'Install macOS*.app' -print -quit)"
          fi
          [ -n "${APP}" ] && [ -d "${APP}" ] || { echo "::error::没有找到安装器"; exit 1; }
          WORK="${RUNNER_TEMP}/work"
          mkdir -p "${WORK}" dist
          echo "安装器: ${APP}"

          # 1. 创建一个 dmg
          hdiutil create -o "${WORK}/${NAME}" -size "${DMG_SIZE}" -volname "${NAME}" -layout SPUD -fs HFS+J
          # 2. 挂载
          DEV="$(hdiutil attach "${WORK}/${NAME}.dmg" -noverify -mountpoint "/Volumes/${NAME}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          echo "已挂载 ${DEV} -> /Volumes/${NAME}"
          # 3. 写入安装器
          sudo "${APP}/Contents/Resources/createinstallmedia" --volume "/Volumes/${NAME}" --nointeraction
          # 4. 卸载
          sudo hdiutil detach "${DEV}" -force
          # 安装器已用完（约 8 GB），删除以腾出转换所需空间
          sudo rm -rf "${APP}" 2>/dev/null || true
          # 5. 转换为 cdr
          hdiutil convert "${WORK}/${NAME}.dmg" -format UDTO -o "${WORK}/${NAME}"
          # 6. 改名成 iso
          mv "${WORK}/${NAME}.cdr" "${WORK}/${NAME}.iso"

          # GitHub Release 单文件上限 2 GiB，按 1900 MiB 分卷
          split -b 1900m "${WORK}/${NAME}.iso" "dist/${NAME}.iso.part-"
          rm -f "${WORK}/${NAME}.iso"
          ( cd dist && shasum -a 256 "${NAME}".iso.part-* > SHA256SUMS.txt )
          du -sh dist/*

      - name: 发布 Release 并提供下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="macos-${NAME}-${VERSION}"
          {
            echo "macOS ${VERSION} (${NAME}) 安装镜像"
            echo
            echo "拼接分卷（GitHub 单文件上限 2 GiB）:"
            echo "  macOS / Linux : cat ${NAME}.iso.part-* > ${NAME}.iso"
            echo "  Windows cmd   : copy /b ${NAME}.iso.part-* ${NAME}.iso"
            echo "校验:"
            echo "  shasum -a 256 -c SHA256SUMS.txt"
            echo
            echo "VMware: .vmx 文件中加入 smc.version = \"0\""
          } > dist/README.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
          gh release create "${TAG}" \
            dist/"${NAME}".iso.part-* dist/SHA256SUMS.txt dist/README.txt \
            --title "macOS ${VERSION} (${NAME}) 安装镜像" \
            --notes-file dist/README.txt \
            --latest=false

          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## macOS ${VERSION} (${NAME}) 镜像下载"
            echo
            echo "发布页: [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo
            echo "| 文件 | 下载链接 |"
            echo "| --- | --- |"
            for f in dist/"${NAME}".iso.part-* dist/SHA256SUMS.txt; do
              b="$(basename "${f}")"
              echo "| ${b} | [${b}](${BASE}/${b}) |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
